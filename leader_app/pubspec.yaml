name: hdc_mobile
description: 移动执法监控 · HdDataCollection Mobile
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 网络
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # 实时通讯
  signalr_netcore: ^1.3.7

  # 视频
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # 音频（对讲）
  flutter_sound: ^9.6.0
  permission_handler: ^11.3.1

  # 路由
  go_router: ^14.1.4

  # 通知
  flutter_local_notifications: ^17.1.2

  # 工具
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.3

  # 地图（在线高德栅格瓦片，与平台 Leaflet 同源，无需 key）
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
